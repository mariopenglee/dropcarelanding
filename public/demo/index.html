<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Water Reminder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      background: #ffffff;
      margin: 0;
      padding: 0;
    }

    .embed-wrapper {
      width: 100%;
      height: 728px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .page {
      width: 100%;
      max-width: 980px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    /* ── Top cards ── */
    .cards {
      display: flex;
      gap: 24px;
      flex-wrap: nowrap;
      justify-content: center;
      width: 100%;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 0;
      width: 300px;
      flex-shrink: 0;
      box-shadow: 0 4px 10px 0 rgba(0, 77, 200, 0.10);
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      gap: 12px;
      padding: 0 20px 0 0;
    }

    .card-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .card-icon {
      width: 72px;
      height: 72px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .card-text {
      padding: 16px 0;
    }

    .card-title {
      font-size: 17px;
      font-weight: 700;
      color: #111;
      line-height: 1.2;
    }

    .card-subtitle {
      font-size: 12px;
      color: #999;
      font-weight: 400;
      margin-top: 2px;
    }

    .card-time {
      font-size: 28px;
      font-weight: 800;
      color: #111;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .card--drops {
      width: 180px;
    }


    .picker--single {
      justify-content: center;
    }

    .picker--single .picker-col {
      flex: none;
      width: 80px;
    }

    /* ── Scroll picker ── */
    .picker {
      display: flex;
      justify-content: center;
      gap: 0;
      position: relative;
      height: 200px;
      overflow: hidden;
      border-top: 1px solid #f0f0f0;
    }

    .picker::before,
    .picker::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 72px;
      pointer-events: none;
      z-index: 2;
    }

    .picker::before {
      top: 0;
      background: linear-gradient(to bottom, rgba(255,255,255,0.95), rgba(255,255,255,0));
    }

    .picker::after {
      bottom: 0;
      background: linear-gradient(to top, rgba(255,255,255,0.95), rgba(255,255,255,0));
    }

    .picker-highlight {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      transform: translateY(-50%);
      height: 40px;
      background: #f5f5f7;
      border-radius: 10px;
      z-index: 1;
      margin: 0 12px;
    }

    .picker-col {
      flex: 1;
      height: 200px;
      overflow-y: scroll;
      -ms-overflow-style: none;
      scrollbar-width: none;
      position: relative;
      z-index: 3;
      padding: 80px 0;
    }

    .picker-col::-webkit-scrollbar {
      display: none;
    }

    .picker-item {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 400;
      color: #bbb;
      cursor: pointer;
      transition: color 0.15s, font-weight 0.15s;
    }

    .picker-item.selected {
      color: #111;
      font-weight: 600;
    }

    .picker-ampm {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 0;
      padding: 80px 8px 80px 0;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -ms-overflow-style: none;
      scrollbar-width: none;
      z-index: 3;
    }

    .picker-ampm::-webkit-scrollbar { display: none; }

    /* ── Pulse hint on wake-up minutes ── */
    .pulse-hint {
      position: relative;
      overflow: visible;
    }

    .pulse-hint::after {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      width: 80px; height: 80px;
      margin: -40px 0 0 -40px;
      border-radius: 50%;
      background: radial-gradient(circle, #83E9FF 0%, rgba(131, 233, 255, 0) 70%);
      animation: num-pulse 1.8s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes num-pulse {
      0%, 100% { opacity: 0; transform: scale(0.3); }
      50%       { opacity: 0.9; transform: scale(1); }
    }

    /* ── Timeline update flash ── */
    .tl-updated {
      animation: tl-pop 0.4s ease-out forwards;
    }

    @keyframes tl-pop {
      0%   { opacity: 0.2; transform: scale(0.85); }
      60%  { transform: scale(1.08); }
      100% { opacity: 1; transform: scale(1); }
    }

    .picker-ampm .picker-item {
      font-size: 16px;
    }

    /* ── Timeline ── */
    .timeline-section {
      width: 100%;
    }

    .timeline {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 8px;
    }

    .timeline-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .timeline-time {
      font-size: 14px;
      font-weight: 600;
      color: #555;
    }

    .timeline-item.endpoint .timeline-time {
      font-size: 36px;
      font-weight: 900;
      color: #111;
    }

    .timeline-connector {
      width: 1px;
      height: 32px;
      background: #b0c4d8;
    }

    .drop {
      width: 90px;
      height: 108px;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0, 77, 200, 0.10));
    }


    /* ══ Mobile / Tablet  (< 900px) ══ */
    @media (max-width: 899px) {
      body { background: #f2f2f7; }

      .embed-wrapper {
        height: auto;
        min-height: 100vh;
        overflow: visible;
        align-items: flex-start;
        padding: 24px 16px 32px;
      }

      .page {
        max-width: 343px;
        gap: 14px;
      }

      .cards {
        flex-direction: column;
        gap: 14px;
      }

      /* all cards go full width */
      .card, .card--drops {
        width: 100% !important;
        flex-shrink: 1;
        border-radius: 18px;
        box-shadow: 0 2px 8px 0 rgba(0,77,200,0.08);
      }

      /* reorder: drops → 1st, wake-up → 2nd, bedtime → 3rd */
      .cards > .card:nth-child(1) { order: 2; }
      .cards > .card:nth-child(2) { order: 1; }
      .cards > .card:nth-child(3) { order: 3; }

      .card-header { padding: 0 18px 0 0; }
      .card-info   { gap: 10px; }
      .card-icon   { width: 60px; height: 60px; }
      .card-text   { padding: 14px 0; }
      .card-title  { font-size: 16px; }
      .card-subtitle { font-size: 11px; }
      .card-time   { font-size: 24px; }

      .picker { height: 160px; }
      .picker::before,
      .picker::after  { height: 56px; }
      .picker-col     { height: 160px; padding: 60px 0; }
      .picker--single .picker-col { width: 100px; }

      .timeline { gap: 0; }
      .timeline-item.endpoint .timeline-time { font-size: 20px; }
      .timeline-time   { font-size: 11px; white-space: nowrap; }
      .timeline-connector { height: 24px; }
      .drop { width: 52px; height: 62px; }
    }
  </style>
</head>

  <script>

    /* ── Picker builder (24h, no am/pm) ── */
    function buildPicker({ hoursEl, minutesEl, displayEl, initialHour, initialMinute, onChange }) {
      const hours   = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0'));
      const minutes = ['00', '05', '10', '15', '20', '25', '30', '35', '40', '45', '50', '55'];

      let state = { h: initialHour, m: initialMinute };

      function update() {
        displayEl.textContent = state.h + '.' + state.m;
        if (onChange) onChange(parseInt(state.h), parseInt(state.m));
      }

      function makeCol(col, items, initVal, onSelect) {
        items.forEach((val, i) => {
          const div = document.createElement('div');
          div.className = 'picker-item' + (val === initVal ? ' selected' : '');
          div.textContent = val;
          div.addEventListener('click', () => col.scrollTo({ top: i * 40, behavior: 'smooth' }));
          col.appendChild(div);
        });

        let currentIdx = Math.max(0, items.indexOf(initVal));
        let ignoreNext = true;
        let snapping = false;
        col.scrollTop = currentIdx * 40;
        col.dataset.scrollIdx = currentIdx;
        requestAnimationFrame(() => { ignoreNext = false; });

        let timer;
        function settle() {
          currentIdx = Math.min(Math.max(Math.round(col.scrollTop / 40), 0), items.length - 1);
          col.querySelectorAll('.picker-item').forEach((el, i) => el.classList.toggle('selected', i === currentIdx));
          col.dataset.scrollIdx = currentIdx;
          snapping = true;
          col.scrollTo({ top: currentIdx * 40, behavior: 'smooth' });
          onSelect(items[currentIdx]);
          setTimeout(() => { snapping = false; }, 400);
        }

        col.addEventListener('scroll', () => {
          if (ignoreNext || snapping) return;
          clearTimeout(timer);
          timer = setTimeout(settle, 150);
        });
      }

      makeCol(hoursEl,   hours,   initialHour,   v => { state.h = v; update(); });
      makeCol(minutesEl, minutes, initialMinute, v => { state.m = v; update(); });

      update();
    }

    let wakeHour = 10, wakeMins = 0;
    let bedHour = 23, bedMins = 0;
    let dropCount = 6;

    let timelineInitDone = false;
    function buildTimeline() {
      const tl = document.getElementById('timeline');
      tl.innerHTML = '';

      const startMins = wakeHour * 60 + wakeMins;
      const endMins = bedHour * 60 + bedMins;
      const totalMins = endMins - startMins;
      if (totalMins <= 0) return;

      const COUNT = dropCount;
      const points = [];
      if (COUNT === 1) {
        points.push(startMins);
      } else {
        for (let i = 0; i < COUNT; i++) {
          points.push(Math.round(startMins + (totalMins / (COUNT - 1)) * i));
        }
      }

      points.forEach((mins, idx) => {
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        const label = String(h).padStart(2, '0') + '.' + String(m).padStart(2, '0');
        const isEnd = idx === 0 || idx === COUNT - 1;

        const item = document.createElement('div');
        item.className = 'timeline-item' + (isEnd ? ' endpoint' : '');

        const timeEl = document.createElement('div');
        timeEl.className = 'timeline-time' + (timelineInitDone ? ' tl-updated' : '');
        timeEl.textContent = label;

        item.appendChild(timeEl);
        item.insertAdjacentHTML('beforeend', '<div class="timeline-connector"></div>' + dropSVG);
        tl.appendChild(item);
      });
    }

    /* ── Init ── */
    buildPicker({
      hoursEl: document.getElementById('wakeup-hours'),
      minutesEl: document.getElementById('wakeup-minutes'),
      displayEl: document.getElementById('wakeup-display'),
      initialHour: '10', initialMinute: '00',
      onChange: (h, m) => { wakeHour = h; wakeMins = m; buildTimeline(); }
    });

    buildPicker({
      hoursEl: document.getElementById('bedtime-hours'),
      minutesEl: document.getElementById('bedtime-minutes'),
      displayEl: document.getElementById('bedtime-display'),
      initialHour: '23', initialMinute: '00',
      onChange: (h, m) => { bedHour = h; bedMins = m; buildTimeline(); }
    });

    /* ── Drops picker ── */
    (function () {
      const col = document.getElementById('drops-count');
      const counts = ['1', '2', '3', '4', '5', '6', '7'];
      const initVal = '6';

      counts.forEach((val, i) => {
        const div = document.createElement('div');
        div.className = 'picker-item' + (val === initVal ? ' selected' : '');
        div.textContent = val;
        div.addEventListener('click', () => col.scrollTo({ top: i * 40, behavior: 'smooth' }));
        col.appendChild(div);
      });

      let currentIdx = counts.indexOf(initVal);
      let ignoreNext = true;
      let snapping = false;
      col.scrollTop = currentIdx * 40;
      col.dataset.scrollIdx = currentIdx;
      requestAnimationFrame(() => { ignoreNext = false; });

      let timer;
      function settle() {
        currentIdx = Math.min(Math.max(Math.round(col.scrollTop / 40), 0), counts.length - 1);
        col.querySelectorAll('.picker-item').forEach((el, i) => el.classList.toggle('selected', i === currentIdx));
        col.dataset.scrollIdx = currentIdx;
        snapping = true;
        col.scrollTo({ top: currentIdx * 40, behavior: 'smooth' });
        dropCount = parseInt(counts[currentIdx]);
        buildTimeline();
        setTimeout(() => { snapping = false; }, 400);
      }

      col.addEventListener('scroll', () => {
        if (ignoreNext || snapping) return;
        clearTimeout(timer);
        timer = setTimeout(settle, 120);
      });
    })();

    setTimeout(function () { timelineInitDone = true; }, 0);

    // Pulse hint on the selected minute in the wake-up picker
    setTimeout(function () {
      const col = document.getElementById('wakeup-hours');
      const sel = col && col.querySelector('.picker-item.selected');
      if (!sel) return;
      sel.classList.add('pulse-hint');
      function removePulse() {
        sel.classList.remove('pulse-hint');
        document.querySelectorAll('.picker-col').forEach(c => c.removeEventListener('pointerdown', removePulse));
      }
      document.querySelectorAll('.picker-col').forEach(c => c.addEventListener('pointerdown', removePulse, { once: true }));
    }, 1200);

    // Guard: restore picker scrollTop when Figma Sites resets it at breakpoints.
    // Uses pointerdown/pointerup (not scroll) to track user interaction, so
    // browser-initiated resets don't accidentally block restoration.
    (function () {
      var userScrolling = {};
      document.querySelectorAll('.picker-col').forEach(function (col) {
        col.addEventListener('pointerdown', function () {
          userScrolling[col.id] = true;
        });
        ['pointerup', 'pointercancel'].forEach(function (evt) {
          col.addEventListener(evt, function () {
            setTimeout(function () { userScrolling[col.id] = false; }, 700);
          });
        });
      });

      function restoreAll(force) {
        document.querySelectorAll('.picker-col').forEach(function (col) {
          if (!force && userScrolling[col.id]) return;
          var want = parseInt(col.dataset.scrollIdx || '0') * 40;
          if (Math.abs(col.scrollTop - want) > 15) col.scrollTop = want;
        });
      }

      setInterval(restoreAll, 200);

      // Restore immediately on resize (fires when Figma Sites resizes the iframe)
      window.addEventListener('resize', function () {
